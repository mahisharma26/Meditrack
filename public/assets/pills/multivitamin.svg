<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="softgelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="45%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#1a3b38" flood-opacity="0.22"/>
    </filter>
  </defs>
  <circle cx="100" cy="100" r="92" fill="#FEF3C7"/>
  <!-- Glossy Softgel Capsule -->
  <g transform="rotate(-40 100 100)" filter="url(#shadow)">
    <rect x="52" y="76" width="96" height="48" rx="24" fill="url(#softgelGrad)" stroke="#92400e" stroke-width="1.5"/>
    <!-- Highlight shine for softgel translucent look -->
    <ellipse cx="88" cy="88" rx="22" ry="6" fill="#ffffff" opacity="0.65" transform="rotate(-5 88 88)"/>
    <ellipse cx="120" cy="112" rx="12" ry="3" fill="#ffffff" opacity="0.4"/>
  </g>
</svg>
