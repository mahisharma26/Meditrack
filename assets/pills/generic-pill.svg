<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#1a3b38" flood-opacity="0.2"/>
    </filter>
  </defs>
  <circle cx="100" cy="100" r="92" fill="#E6F4F1"/>
  <!-- Two tone capsule: Deep Teal / Soft White -->
  <g transform="rotate(-35 100 100)" filter="url(#shadow)">
    <!-- Base container -->
    <clipPath id="capsuleClip">
      <rect x="50" y="75" width="100" height="50" rx="25"/>
    </clipPath>
    <g clip-path="url(#capsuleClip)">
      <!-- Left half Teal -->
      <rect x="50" y="75" width="50" height="50" fill="#1A6B70"/>
      <!-- Right half White -->
      <rect x="100" y="75" width="50" height="50" fill="#F8FAFC"/>
      <!-- Join line ring -->
      <line x1="100" y1="75" x2="100" y2="125" stroke="#0E484C" stroke-width="2"/>
    </g>
    <!-- Border -->
    <rect x="50" y="75" width="100" height="50" rx="25" fill="none" stroke="#0e484c" stroke-width="1.5"/>
    <!-- Highlight shine -->
    <path d="M 65 83 Q 100 80 135 83" stroke="#ffffff" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.6"/>
  </g>
</svg>
